[build-system]
requires = ["setuptools>=77"]  # 77 added the SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "cogitator"
version = "0.3.0-beta.2"
description = "Terminal mod manager for Warhammer 40,000: Darktide"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["darktide", "warhammer", "mods", "mod manager", "tui", "nexus"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "textual>=0.80",
  "httpx>=0.27",
  "platformdirs>=4",
  "vdf>=3.4",
  "sv-ttk>=2.6",  # Sun Valley (Windows 11 look) theme for the tkinter GUI; MIT
  "cryptography>=42",
  "tomli>=2; python_version < '3.11'",
  # Windows Credential Locker for the Nexus key by default; elsewhere it stays optional (0600-file fallback).
  "keyring>=24; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/MRITARI/Cogitator"
Issues = "https://github.com/MRITARI/Cogitator/issues"

[project.optional-dependencies]
keyring = ["keyring>=24"]
web = ["pywebview>=5"]  # the web-style window (cogitator-web); needs the Edge WebView2 runtime. BSD-3-Clause
dev = ["pytest", "respx", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[project.scripts]
cogitator = "cogitator.cli:main"

[project.gui-scripts]
cogitator-setup = "cogitator_setup.app:main"
cogitator-gui = "cogitator_gui.app:main"
cogitator-web = "cogitator_web.app:main"

[tool.setuptools.packages.find]
include = ["cogitator*", "cogitator_setup*", "cogitator_gui*", "cogitator_web*"]

[tool.setuptools.package-data]
cogitator = ["locales/*.json"]
cogitator_web = ["ui/*", "ui/js/*", "ui/js/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E731", "I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
